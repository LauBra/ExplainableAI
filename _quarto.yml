    - title: "Explainable AI"
      contents:
        - DALEX_tidymodels_example.qmd
        - Extra.qmd 
  
  page-footer: 
    left: "Copyright 2024, Laura Bravo" 
    background: light
    right: 
      - icon: twitter 
        href: https://twitter.com/laura_bravo94
      - icon: github
        href: https://github.com/LauBra/RIntro2023
    
format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
   # code-fold: true
    code-tools: true
    code-link: true

editor: visual

